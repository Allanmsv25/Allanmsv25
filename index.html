<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atelier Ponto Certo - Agendamento Online</title>
    <meta name="description" content="Agende seu atendimento no Atelier Ponto Certo: ajustes, costura personalizada, reforma de peças e consultoria de estilo.">
    <meta name="keywords" content="atelier, costura, ajustes, reforma, roupas, agendamento, Santo André">
    <meta name="author" content="Atelier Ponto Certo">
    <meta property="og:title" content="Atelier Ponto Certo - Agendamento Online">
    <meta property="og:description" content="Agende seu atendimento de costura online de forma rápida e fácil">
    <meta property="og:type" content="website">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧵</text></svg>">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            max-width: 400px;
            width: 100%;
            overflow: hidden;
            animation: slideUp 0.6s ease-out;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .header {
            background: linear-gradient(135deg, #ff6b6b, #ee5a24);
            color: white;
            padding: 25px 20px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .header::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: repeating-linear-gradient(
                45deg,
                transparent,
                transparent 10px,
                rgba(255,255,255,0.1) 10px,
                rgba(255,255,255,0.1) 20px
            );
            animation: float 20s linear infinite;
        }

        @keyframes float {
            0% { transform: translate(-50%, -50%) rotate(0deg); }
            100% { transform: translate(-50%, -50%) rotate(360deg); }
        }

        .header h1 {
            font-size: 1.8rem;
            margin-bottom: 5px;
            position: relative;
            z-index: 1;
        }

        .header p {
            opacity: 0.9;
            position: relative;
            z-index: 1;
        }

        .chat-container {
            height: 400px;
            overflow-y: auto;
            padding: 20px;
            background: white;
        }

        .chat-container::-webkit-scrollbar {
            width: 6px;
        }

        .chat-container::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 10px;
        }

        .chat-container::-webkit-scrollbar-thumb {
            background: #c1c1c1;
            border-radius: 10px;
        }

        .message {
            margin-bottom: 15px;
            display: flex;
            animation: fadeIn 0.4s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.bot {
            justify-content: flex-start;
        }

        .message.user {
            justify-content: flex-end;
        }

        .message-content {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 18px;
            position: relative;
        }

        .bot .message-content {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
            border-bottom-left-radius: 6px;
        }

        .user .message-content {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            color: white;
            border-bottom-right-radius: 6px;
        }

        .options-container {
            margin-top: 10px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .option-btn {
            background: rgba(255, 255, 255, 0.2);
            border: 2px solid rgba(255, 255, 255, 0.3);
            color: white;
            padding: 10px 15px;
            border-radius: 15px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 14px;
            text-align: left;
        }

        .option-btn:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: translateX(5px);
        }

        .option-btn:disabled {
            background: rgba(255, 255, 255, 0.1);
            color: rgba(255, 255, 255, 0.5);
            cursor: not-allowed;
            transform: none;
        }

        .time-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
            margin-top: 10px;
        }

        .time-slot {
            background: rgba(255, 255, 255, 0.2);
            border: 2px solid rgba(255, 255, 255, 0.3);
            color: white;
            padding: 8px 12px;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 13px;
            text-align: center;
        }

        .time-slot:hover:not(:disabled) {
            background: rgba(255, 255, 255, 0.3);
            transform: scale(1.05);
        }

        .time-slot:disabled {
            background: rgba(255, 255, 255, 0.1);
            color: rgba(255, 255, 255, 0.4);
            cursor: not-allowed;
            text-decoration: line-through;
        }

        .input-container {
            padding: 20px;
            background: #f8f9fa;
            border-top: 1px solid #eee;
        }

        .input-group {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        input[type="text"], input[type="date"], input[type="email"], input[type="password"], input[type="tel"] {
            flex: 1;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 25px;
            font-size: 14px;
            outline: none;
            transition: all 0.3s ease;
        }

        input:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .send-btn {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: bold;
        }

        .send-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .typing-indicator {
            display: none;
            align-items: center;
            gap: 5px;
            color: #666;
            font-style: italic;
            padding: 10px 0;
        }

        .typing-dots {
            display: flex;
            gap: 3px;
        }

        .typing-dots span {
            width: 6px;
            height: 6px;
            background: #666;
            border-radius: 50%;
            animation: typing 1.4s infinite;
        }

        .typing-dots span:nth-child(2) {
            animation-delay: 0.2s;
        }

        .typing-dots span:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes typing {
            0%, 60%, 100% {
                transform: translateY(0);
            }
            30% {
                transform: translateY(-10px);
            }
        }

        .hidden {
            display: none !important;
        }

        .appointment-summary {
            background: rgba(255, 255, 255, 0.1);
            padding: 15px;
            border-radius: 10px;
            margin-top: 10px;
            border-left: 4px solid rgba(255, 255, 255, 0.5);
        }

        .appointment-summary h4 {
            margin-bottom: 10px;
            color: rgba(255, 255, 255, 0.9);
        }

        .appointment-summary p {
            margin: 5px 0;
            color: rgba(255, 255, 255, 0.8);
        }

        .status-message {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #2ecc71;
            color: white;
            padding: 10px 15px;
            border-radius: 20px;
            font-size: 14px;
            z-index: 999;
            display: none;
        }

        .status-message.error {
            background: #e74c3c;
        }

        .status-message.show {
            display: block;
            animation: slideInFromRight 0.3s ease-out;
        }

        @keyframes slideInFromRight {
            from {
                transform: translateX(100%);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        /* Admin Panel Styles */
        .admin-panel {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 1000;
        }

        .admin-btn {
            background: linear-gradient(135deg, #2ecc71, #27ae60);
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 50px;
            cursor: pointer;
            font-size: 12px;
            box-shadow: 0 4px 15px rgba(46, 204, 113, 0.3);
            transition: all 0.3s ease;
        }

        .admin-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(46, 204, 113, 0.4);
        }

        .admin-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            z-index: 1001;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .admin-content {
            background: white;
            border-radius: 15px;
            max-width: 900px;
            width: 100%;
            max-height: 80vh;
            overflow-y: auto;
            position: relative;
        }

        .admin-header {
            background: linear-gradient(135deg, #2ecc71, #27ae60);
            color: white;
            padding: 20px;
            border-radius: 15px 15px 0 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .close-btn {
            background: none;
            border: none;
            color: white;
            font-size: 24px;
            cursor: pointer;
            padding: 0;
            width: 30px;
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            transition: background 0.3s ease;
        }

        .close-btn:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .admin-body {
            padding: 20px;
        }

        .login-form {
            max-width: 400px;
            margin: 0 auto;
            text-align: center;
        }

        .login-form h3 {
            margin-bottom: 20px;
            color: #2ecc71;
        }

        .login-form input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 2px solid #e0e0e0;
            border-radius: 25px;
            outline: none;
            font-size: 14px;
        }

        .login-form input:focus {
            border-color: #2ecc71;
        }

        .login-error {
            color: #e74c3c;
            margin-top: 10px;
            font-size: 14px;
            display: none;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            padding: 20px;
            border-radius: 15px;
            text-align: center;
        }

        .stat-number {
            font-size: 2.5em;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .stat-label {
            font-size: 14px;
            opacity: 0.9;
        }

        .appointments-container {
            background: #f8f9fa;
            border-radius: 15px;
            padding: 20px;
            margin-top: 20px;
        }

        .appointments-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .filter-container {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .filter-input {
            padding: 8px 12px;
            border: 2px solid #e0e0e0;
            border-radius: 20px;
            outline: none;
            font-size: 14px;
        }

        .filter-input:focus {
            border-color: #2ecc71;
        }

        .appointment-card {
            background: white;
            border: 1px solid #e0e0e0;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 15px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
            transition: transform 0.2s ease;
        }

        .appointment-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
        }

        .appointment-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .appointment-time {
            font-size: 18px;
            font-weight: bold;
            color: #2ecc71;
        }

        .appointment-status {
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            text-transform: uppercase;
        }

        .status-confirmado {
            background: #2ecc71;
            color: white;
        }

        .status-pendente {
            background: #f39c12;
            color: white;
        }

        .status-cancelado {
            background: #e74c3c;
            color: white;
        }

        .appointment-details {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
        }

        .detail-item {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .detail-label {
            font-size: 12px;
            color: #666;
            text-transform: uppercase;
            font-weight: bold;
        }

        .detail-value {
            font-size: 14px;
            color: #333;
        }

        .no-appointments {
            text-align: center;
            color: #999;
            font-style: italic;
            padding: 40px 20px;
        }

        .export-btn {
            background: linear-gradient(135deg, #3498db, #2980b9);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s ease;
        }

        .export-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 10px rgba(52, 152, 219, 0.3);
        }

        /* Responsividade */
        @media (max-width: 480px) {
            .container {
                margin: 10px;
                max-width: calc(100vw - 20px);
            }
            
            .header h1 {
                font-size: 1.5rem;
            }

            .time-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <!-- Status Message -->
    <div class="status-message" id="statusMessage"></div>

    <!-- Admin Panel -->
    <div class="admin-panel">
        <button class="admin-btn" onclick="openAdminPanel()" id="adminBtn">👤 Admin</button>
    </div>

    <!-- Admin Modal -->
    <div class="admin-modal" id="adminModal">
        <div class="admin-content">
            <div class="admin-header">
                <h2>📋 Painel Administrativo</h2>
                <div style="display: flex; gap: 10px; align-items: center;">
                    <button class="close-btn" onclick="logout()" title="Fazer Logout" style="background: rgba(255,255,255,0.2); border-radius: 5px; padding: 5px 10px; font-size: 12px; display: none;" id="logoutBtn">🔐 Sair</button>
                    <button class="close-btn" onclick="closeAdminPanel()" title="Fechar Painel">&times;</button>
                </div>
            </div>
            <div class="admin-body" id="adminBody">
                <!-- Conteúdo será carregado dinamicamente -->
            </div>
        </div>
    </div>

    <div class="container">
        <div class="header">
            <h1>🧵 Atelier Ponto Certo</h1>
            <p>Agendamento online - Sistema local</p>
        </div>
        
        <div class="chat-container" id="chatContainer">
            <div class="message bot">
                <div class="message-content">
                    Olá! Bem-vinda ao Atelier Ponto Certo! ✨<br><br>
                    Sou sua assistente virtual e estou aqui para ajudar você a agendar seu atendimento.
                    <div class="options-container">
                        <button class="option-btn" onclick="selectService('ajuste')">👗 Ajustes de roupas</button>
                        <button class="option-btn" onclick="selectService('costura')">✂️ Costura personalizada</button>
                        <button class="option-btn" onclick="selectService('reforma')">🔄 Reforma de peças</button>
                        <button class="option-btn" onclick="selectService('consultoria')">💡 Consultoria de estilo</button>
                    </div>
                </div>
            </div>
            
            <div class="typing-indicator" id="typingIndicator">
                <span>Digitando</span>
                <div class="typing-dots">
                    <span></span>
                    <span></span>
                    <span></span>
                </div>
            </div>
        </div>
        
        <div class="input-container">
            <div class="input-group" id="textInputGroup">
                <input type="text" id="messageInput" placeholder="Digite sua mensagem..." onkeypress="handleKeyPress(event)">
                <button class="send-btn" onclick="sendMessage()">Enviar</button>
            </div>
            
            <div class="input-group hidden" id="dateInputGroup">
                <input type="date" id="dateInput">
                <button class="send-btn" onclick="selectDate()">Confirmar Data</button>
            </div>

            <div class="input-group hidden" id="nameInputGroup">
                <input type="text" id="nameInput" placeholder="Digite seu nome completo...">
                <button class="send-btn" onclick="submitName()">Confirmar</button>
            </div>

            <div class="input-group hidden" id="phoneInputGroup">
                <input type="tel" id="phoneInput" placeholder="Digite seu telefone...">
                <button class="send-btn" onclick="submitPhone()">Confirmar</button>
            </div>

            <div class="input-group hidden" id="emailInputGroup">
                <input type="email" id="emailInput" placeholder="Digite seu email...">
                <button class="send-btn" onclick="submitEmail()">Finalizar</button>
            </div>
        </div>
    </div>

    <script>
        // Estado do agendamento
        let appointmentData = {
            service: '',
            date: '',
            time: '',
            name: '',
            phone: '',
            email: ''
        };

        // Estado da administração
        let isAdminLoggedIn = false;
        const adminCredentials = {
            username: 'marisa@atelier.com.br',
            password: 'ponto certo'
        };

        // Função para abrir painel administrativo
        function openAdminPanel() {
            if (isAdminLoggedIn) {
                loadAdminDashboard();
            } else {
                loadLoginForm();
            }
            document.getElementById('adminModal').style.display = 'flex';
        }

        // Função para fechar painel administrativo
        function closeAdminPanel() {
            document.getElementById('adminModal').style.display = 'none';
        }

        // Função para carregar formulário de login
        function loadLoginForm() {
            const adminBody = document.getElementById('adminBody');
            adminBody.innerHTML = `
                <div class="login-form">
                    <h3>🔐 Login Administrativo</h3>
                    <input type="email" id="adminUsername" placeholder="Email" value="marisa@atelier.com.br">
                    <input type="password" id="adminPassword" placeholder="Senha" value="ponto certo">
                    <button class="send-btn" onclick="attemptLogin()" style="width: 100%; margin-top: 20px;">Entrar</button>
                    <div class="login-error" id="loginError">❌ Credenciais incorretas!</div>
                    
                    <div style="background: #f8f9fa; padding: 15px; border-radius: 10px; margin-top: 20px; border-left: 4px solid #2ecc71;">
                        <h4 style="margin: 0 0 10px 0; color: #2ecc71; font-size: 14px;">🛡️ Credenciais do Firebase</h4>
                        <p style="margin: 0; font-size: 12px; color: #666;">
                            <strong>Email:</strong> marisa@atelier.com.br<br>
                            <strong>Senha:</strong> ponto certo
                        </p>
                    </div>
                </div>
            `;
        }

        // Função para tentar login
        function attemptLogin() {
            const username = document.getElementById('adminUsername').value.trim();
            const password = document.getElementById('adminPassword').value.trim();
            const errorDiv = document.getElementById('loginError');

            if (username === adminCredentials.username && password === adminCredentials.password) {
                isAdminLoggedIn = true;
                errorDiv.style.display = 'none';
                loadAdminDashboard();
                showStatusMessage('Login realizado com sucesso!', 'success');
            } else {
                errorDiv.style.display = 'block';
                showStatusMessage('Credenciais incorretas!', 'error');
            }
        }

        // Função para logout
        function logout() {
            isAdminLoggedIn = false;
            closeAdminPanel();
            showStatusMessage('Logout realizado com sucesso!', 'success');
        }

        // Função para carregar dashboard administrativo
        function loadAdminDashboard() {
            document.getElementById('logoutBtn').style.display = 'block';
            
            const appointments = getAppointments();
            const stats = calculateStats(appointments);
            
            const adminBody = document.getElementById('adminBody');
            adminBody.innerHTML = `
                <div class="stats-grid">
                    <div class="stat-card">
                        <div class="stat-number">${stats.total}</div>
                        <div class="stat-label">Total de Agendamentos</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-number">${stats.today}</div>
                        <div class="stat-label">Hoje</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-number">${stats.thisWeek}</div>
                        <div class="stat-label">Esta Semana</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-number">${stats.thisMonth}</div>
                        <div class="stat-label">Este Mês</div>
                    </div>
                </div>

                <div class="appointments-container">
                    <div class="appointments-header">
                        <h3>📅 Agendamentos</h3>
                        <button class="export-btn" onclick="exportData()">📊 Exportar CSV</button>
                    </div>
                    
                    <div class="filter-container">
                        <input type="date" class="filter-input" id="dateFilter" placeholder="Filtrar por data" onchange="filterAppointments()">
                        <select class="filter-input" id="serviceFilter" onchange="filterAppointments()">
                            <option value="">Todos os Serviços</option>
                            <option value="ajuste">Ajustes</option>
                            <option value="costura">Costura</option>
                            <option value="reforma">Reforma</option>
                            <option value="consultoria">Consultoria</option>
                        </select>
                        <select class="filter-input" id="statusFilter" onchange="filterAppointments()">
                            <option value="">Todos os Status</option>
                            <option value="confirmado">Confirmado</option>
                            <option value="pendente">Pendente</option>
                            <option value="cancelado">Cancelado</option>
                        </select>
                        <button class="send-btn" onclick="clearFilters()" style="padding: 8px 15px;">Limpar Filtros</button>
                    </div>
                    
                    <div id="appointmentsList">
                        ${renderAppointments(appointments)}
                    </div>
                </div>
            `;
        }

        // Função para obter agendamentos do localStorage
        function getAppointments() {
            try {
                return JSON.parse(localStorage.getItem('appointments') || '[]');
            } catch (error) {
                console.error('Erro ao carregar agendamentos:', error);
                return [];
            }
        }

        // Função para calcular estatísticas
        function calculateStats(appointments) {
            const today = new Date();
            const todayStr = today.toISOString().split('T')[0];
            
            // Primeira data da semana (domingo)
            const firstDayOfWeek = new Date(today);
            firstDayOfWeek.setDate(today.getDate() - today.getDay());
            
            // Primeiro dia do mês
            const firstDayOfMonth = new Date(today.getFullYear(), today.getMonth(), 1);

            return {
                total: appointments.length,
                today: appointments.filter(app => app.date === todayStr).length,
                thisWeek: appointments.filter(app => {
                    const appDate = new Date(app.date);
                    return appDate >= firstDayOfWeek && appDate <= today;
                }).length,
                thisMonth: appointments.filter(app => {
                    const appDate = new Date(app.date);
                    return appDate >= firstDayOfMonth && appDate <= today;
                }).length
            };
        }

        // Função para renderizar lista de agendamentos
        function renderAppointments(appointments) {
            if (appointments.length === 0) {
                return '<div class="no-appointments">📭 Nenhum agendamento encontrado</div>';
            }

            // Ordenar por data e horário
            const sortedAppointments = appointments.sort((a, b) => {
                const dateA = new Date(a.date + 'T' + a.time);
                const dateB = new Date(b.date + 'T' + b.time);
                return dateB - dateA; // Mais recentes primeiro
            });

            return sortedAppointments.map(app => {
                const dateObj = new Date(app.date + 'T00:00:00');
                const formattedDate = dateObj.toLocaleDateString('pt-BR', {
                    weekday: 'short',
                    day: '2-digit',
                    month: '2-digit',
                    year: 'numeric'
                });

                return `
                    <div class="appointment-card">
                        <div class="appointment-header">
                            <div class="appointment-time">${app.time} - ${formattedDate}</div>
                            <div class="appointment-status status-${app.status || 'confirmado'}">${app.status || 'confirmado'}</div>
                        </div>
                        <div class="appointment-details">
                            <div class="detail-item">
                                <div class="detail-label">Cliente</div>
                                <div class="detail-value">${app.name}</div>
                            </div>
                            <div class="detail-item">
                                <div class="detail-label">Serviço</div>
                                <div class="detail-value">${services[app.service]}</div>
                            </div>
                            <div class="detail-item">
                                <div class="detail-label">Telefone</div>
                                <div class="detail-value">${app.phone}</div>
                            </div>
                            <div class="detail-item">
                                <div class="detail-label">Email</div>
                                <div class="detail-value">${app.email}</div>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // Função para filtrar agendamentos
        function filterAppointments() {
            if (!isAdminLoggedIn) return;

            const dateFilter = document.getElementById('dateFilter').value;
            const serviceFilter = document.getElementById('serviceFilter').value;
            const statusFilter = document.getElementById('statusFilter').value;

            let appointments = getAppointments();

            // Aplicar filtros
            if (dateFilter) {
                appointments = appointments.filter(app => app.date === dateFilter);
            }
            if (serviceFilter) {
                appointments = appointments.filter(app => app.service === serviceFilter);
            }
            if (statusFilter) {
                appointments = appointments.filter(app => (app.status || 'confirmado') === statusFilter);
            }

            // Atualizar lista
            document.getElementById('appointmentsList').innerHTML = renderAppointments(appointments);
        }

        // Função para limpar filtros
        function clearFilters() {
            document.getElementById('dateFilter').value = '';
            document.getElementById('serviceFilter').value = '';
            document.getElementById('statusFilter').value = '';
            filterAppointments();
        }

        // Função para exportar dados para CSV
        function exportData() {
            const appointments = getAppointments();
            
            if (appointments.length === 0) {
                showStatusMessage('Nenhum dado para exportar!', 'error');
                return;
            }

            // Cabeçalhos do CSV
            const headers = ['Data', 'Horário', 'Cliente', 'Telefone', 'Email', 'Serviço', 'Status', 'Data Criação'];
            
            // Dados do CSV
            const csvData = appointments.map(app => [
                app.date,
                app.time,
                app.name,
                app.phone,
                app.email,
                services[app.service] || app.service,
                app.status || 'confirmado',
                app.created_at ? new Date(app.created_at).toLocaleString('pt-BR') : ''
            ]);

            // Combinar cabeçalhos e dados
            const csvContent = [headers, ...csvData]
                .map(row => row.map(field => `"${field}"`).join(','))
                .join('\n');

            // Criar e baixar arquivo
            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement('a');
            const url = URL.createObjectURL(blob);
            
            link.setAttribute('href', url);
            link.setAttribute('download', `agendamentos_atelier_${new Date().toISOString().split('T')[0]}.csv`);
            link.style.visibility = 'hidden';
            
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            
            showStatusMessage('Dados exportados com sucesso!', 'success');
        }

        // Função para atualizar dashboard quando há novos agendamentos
        function refreshAdminDashboard() {
            if (isAdminLoggedIn && document.getElementById('adminModal').style.display === 'flex') {
                loadAdminDashboard();
            }
        }

        const availableTimes = [
            '09:00', '09:30', '10:00', '10:30',
            '14:00', '14:30', '15:00', '15:30',
            '16:00', '16:30'
        ];

        // Serviços disponíveis
        const services = {
            'ajuste': 'Ajustes de roupas',
            'costura': 'Costura personalizada', 
            'reforma': 'Reforma de peças',
            'consultoria': 'Consultoria de estilo'
        };

        document.addEventListener('DOMContentLoaded', function() {
            const today = new Date();
            today.setDate(today.getDate() + 1); // Agendamentos a partir de amanhã
            const minDate = today.toISOString().split('T')[0];

            console.log('Sistema de agendamento inicializado');
            showStatusMessage('Sistema inicializado com sucesso!', 'success');

        // Função para mostrar mensagem de status
        function showStatusMessage(message, type = 'success') {
            const statusDiv = document.getElementById('statusMessage');
            statusDiv.textContent = message;
            statusDiv.className = `status-message ${type} show`;
            
            setTimeout(() => {
                statusDiv.className = 'status-message';
            }, 3000);
        }

        // Função para adicionar mensagem ao chat
        function addMessage(content, isUser = false, hasOptions = false) {
            const chatContainer = document.getElementById('chatContainer');
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${isUser ? 'user' : 'bot'}`;
            
            const contentDiv = document.createElement('div');
            contentDiv.className = 'message-content';
            contentDiv.innerHTML = content;
            
            messageDiv.appendChild(contentDiv);
            chatContainer.appendChild(messageDiv);
            
            // Scroll para baixo
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        // Função para mostrar indicador de digitação
        function showTyping() {
            document.getElementById('typingIndicator').style.display = 'flex';
            const chatContainer = document.getElementById('chatContainer');
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        // Função para esconder indicador de digitação
        function hideTyping() {
            document.getElementById('typingIndicator').style.display = 'none';
        }

        // Função para simular delay de resposta
        function simulateTyping(callback, delay = 1500) {
            showTyping();
            setTimeout(() => {
                hideTyping();
                callback();
            }, delay);
        }

        // Seleção de serviço
        function selectService(serviceKey) {
            const serviceName = services[serviceKey];
            appointmentData.service = serviceKey;
            
            // Desabilitar botões de opção
            document.querySelectorAll('.option-btn').forEach(btn => {
                btn.disabled = true;
            });
            
            addMessage(`${serviceName}`, true);
            
            simulateTyping(() => {
                const message = `Perfeito! Você escolheu: <strong>${serviceName}</strong> ✅<br><br>
                                Agora vamos escolher a data para seu atendimento. Por favor, selecione uma data disponível:`;
                addMessage(message);
                
                // Mostrar seletor de data
                document.getElementById('textInputGroup').classList.add('hidden');
                document.getElementById('dateInputGroup').classList.remove('hidden');
                conversationState = 'date_selection';
            });
        }

        // Seleção de data
        function selectDate() {
            const dateInput = document.getElementById('dateInput');
            const selectedDate = dateInput.value;
            
            if (!selectedDate) {
                showStatusMessage('Por favor, selecione uma data válida!', 'error');
                return;
            }
            
            const dateObj = new Date(selectedDate + 'T00:00:00');
            const formattedDate = dateObj.toLocaleDateString('pt-BR', {
                weekday: 'long',
                year: 'numeric',
                month: 'long',
                day: 'numeric'
            });
            
            appointmentData.date = selectedDate;
            addMessage(formattedDate, true);
            
            simulateTyping(() => {
                const timeOptions = availableTimes.map(time => 
                    `<button class="time-slot" onclick="selectTime('${time}')">${time}</button>`
                ).join('');
                
                const message = `Ótima escolha! 📅<br><br>
                                Data selecionada: <strong>${formattedDate}</strong><br><br>
                                Agora escolha o horário que melhor se adequa à sua agenda:
                                <div class="time-grid">${timeOptions}</div>`;
                addMessage(message);
                
                // Esconder seletor de data
                document.getElementById('dateInputGroup').classList.add('hidden');
                conversationState = 'time_selection';
            });
        }

        // Seleção de horário
        function selectTime(time) {
            appointmentData.time = time;
            
            // Desabilitar botões de horário
            document.querySelectorAll('.time-slot').forEach(btn => {
                btn.disabled = true;
            });
            
            addMessage(`${time}`, true);
            
            simulateTyping(() => {
                const message = `Excelente! ⏰<br><br>
                                Horário selecionado: <strong>${time}</strong><br><br>
                                Para finalizar seu agendamento, preciso de algumas informações pessoais. Vamos começar com seu nome completo:`;
                addMessage(message);
                
                // Mostrar input de nome
                document.getElementById('nameInputGroup').classList.remove('hidden');
                document.getElementById('nameInput').focus();
                conversationState = 'name_input';
            });
        }

        // Submissão do nome
        function submitName() {
            const nameInput = document.getElementById('nameInput');
            const name = nameInput.value.trim();
            
            if (!name || name.length < 2) {
                showStatusMessage('Por favor, digite seu nome completo!', 'error');
                return;
            }
            
            appointmentData.name = name;
            addMessage(name, true);
            
            simulateTyping(() => {
                const message = `Prazer em conhecê-la, ${name}! 😊<br><br>
                                Agora preciso do seu número de telefone para contato:`;
                addMessage(message);
                
                // Trocar input
                document.getElementById('nameInputGroup').classList.add('hidden');
                document.getElementById('phoneInputGroup').classList.remove('hidden');
                document.getElementById('phoneInput').focus();
                conversationState = 'phone_input';
            });
        }

        // Submissão do telefone
        function submitPhone() {
            const phoneInput = document.getElementById('phoneInput');
            const phone = phoneInput.value.trim();
            
            if (!phone || phone.length < 10) {
                showStatusMessage('Por favor, digite um telefone válido!', 'error');
                return;
            }
            
            appointmentData.phone = phone;
            addMessage(phone, true);
            
            simulateTyping(() => {
                const message = `Telefone registrado! 📱<br><br>
                                Por último, seu email para enviarmos a confirmação:`;
                addMessage(message);
                
                // Trocar input
                document.getElementById('phoneInputGroup').classList.add('hidden');
                document.getElementById('emailInputGroup').classList.remove('hidden');
                document.getElementById('emailInput').focus();
                conversationState = 'email_input';
            });
        }

        // Submissão do email e finalização
        function submitEmail() {
            const emailInput = document.getElementById('emailInput');
            const email = emailInput.value.trim();
            
            if (!email || !email.includes('@')) {
                showStatusMessage('Por favor, digite um email válido!', 'error');
                return;
            }
            
            appointmentData.email = email;
            addMessage(email, true);
            
            simulateTyping(() => {
                finalizaAgendamento();
            }, 2000);
        }

        // Finalização do agendamento
        function finalizaAgendamento() {
            const dateObj = new Date(appointmentData.date + 'T00:00:00');
            const formattedDate = dateObj.toLocaleDateString('pt-BR', {
                weekday: 'long',
                year: 'numeric',
                month: 'long',
                day: 'numeric'
            });

            const appointmentSummary = `
                <div class="appointment-summary">
                    <h4>📋 Resumo do Agendamento</h4>
                    <p><strong>Serviço:</strong> ${services[appointmentData.service]}</p>
                    <p><strong>Data:</strong> ${formattedDate}</p>
                    <p><strong>Horário:</strong> ${appointmentData.time}</p>
                    <p><strong>Nome:</strong> ${appointmentData.name}</p>
                    <p><strong>Telefone:</strong> ${appointmentData.phone}</p>
                    <p><strong>Email:</strong> ${appointmentData.email}</p>
                </div>
            `;

            const message = `Perfeito! Seu agendamento foi realizado com sucesso! ✅<br><br>
                            ${appointmentSummary}<br>
                            Em breve você receberá uma confirmação por email e WhatsApp.<br><br>
                            Obrigada por escolher o Atelier Ponto Certo! Até breve! 💖`;

            addMessage(message);
            
            // Esconder todos os inputs
            document.getElementById('emailInputGroup').classList.add('hidden');
            
            // Salvar no localStorage (simulação)
            try {
                const appointments = JSON.parse(localStorage.getItem('appointments') || '[]');
                appointmentData.id = Date.now();
                appointmentData.status = 'confirmado';
                appointmentData.created_at = new Date().toISOString();
                appointments.push(appointmentData);
                localStorage.setItem('appointments', JSON.stringify(appointments));
                
                console.log('Agendamento salvo:', appointmentData);
                showStatusMessage('Agendamento confirmado com sucesso!', 'success');
                
                // Atualizar dashboard admin se estiver aberto
                refreshAdminDashboard();
            } catch (error) {
                console.error('Erro ao salvar agendamento:', error);
                showStatusMessage('Agendamento confirmado! (Dados salvos localmente)', 'success');
            }
            
            conversationState = 'completed';
        }

        // Envio de mensagem de texto livre
        function sendMessage() {
            const messageInput = document.getElementById('messageInput');
            const message = messageInput.value.trim();
            
            if (!message) return;
            
            addMessage(message, true);
            messageInput.value = '';
            
            // Resposta automática simples
            simulateTyping(() => {
                let response = '';
                
                if (conversationState === 'completed') {
                    response = 'Seu agendamento já foi finalizado! Se precisar de algo mais, entre em contato conosco. 😊';
                } else {
                    response = 'Obrigada pela sua mensagem! Para continuar seu agendamento, por favor siga as opções apresentadas acima. 💙';
                }
                
                addMessage(response);
            });
        }

        // Handler para Enter
        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                event.preventDefault();
                
                switch (conversationState) {
                    case 'name_input':
                        submitName();
                        break;
                    case 'phone_input':
                        submitPhone();
                        break;
                    case 'email_input':
                        submitEmail();
                        break;
                    default:
                        sendMessage();
                }
            }
        }

            // Reset do estado

            // Reset dos inputs
            document.querySelectorAll('.input-group').forEach(group => {
                group.classList.add('hidden');
            });
            document.getElementById('textInputGroup').classList.remove('hidden');
        }

        // Adicionar função de reset no console para testes
        window.clearChat = clearChat;
